name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv tools/.venv_linux
          tools/.venv_linux/bin/python -m pip install --upgrade pip
          tools/.venv_linux/bin/python -m pip install -r requirements.txt

      - name: Run headless smoke tests
        run: tools/.venv_linux/bin/python scripts/run_smoke_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check UI translation lookup
        run: node tests/ui_i18n_smoke.cjs

  headless-smoke:
    runs-on: ubuntu-latest
    needs: python-smoke
    if: ${{ always() }}
    steps:
      - name: Require every Python smoke check
        env:
          SMOKE_RESULT: ${{ needs.python-smoke.result }}
        run: test "$SMOKE_RESULT" = success
